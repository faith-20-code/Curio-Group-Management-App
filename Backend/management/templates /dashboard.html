<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CURIO Dashboard</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>


<div class="sidebar">

<div class="logo">
<i class="fa-solid fa-layer-group"></i>
CURIO
</div>

<div class="menu-title">MAIN MENU</div>

<div class=>
<i class="fa-solid fa-chart-line"></i>
Dashboard
</div>

</div>


<div class="main">

<div class="header">
<h1>Dashboard</h1>
<p>Overview of your team's activity and progress.</p>
</div>


<div class="cards">

<div class="card">
<h3><i class="fa-solid fa-users"></i> Active Members</h3>
<div class="value"></div>
</div>

<div class="card">
<h3><i class="fa-solid fa-check-circle"></i> Tasks Completed</h3>
<div class="value"></div>
<div class="progress">
<div class="progress-bar" style="width:10%"></div>
</div>
</div>

<div class="card">
<h3><i class="fa-solid fa-clock"></i> Upcoming Deadlines</h3>
<div class="value"></div>
<p>Next: Draft Review</p>
</div>

<div class="card">
<h3><i class="fa-solid fa-chart-simple"></i> Team Velocity</h3>
<div class="value"></div>
<p>Compared to last sprint</p>
</div>

</div>


<div class="bottom">

<div class="card">

<h3>Recent Activity</h3>

</div>

<div class="card">

<h3>Quick Actions</h3>

<button class="quick-btn">
<i class="fa-solid fa-user-plus"></i>
Invite Member
</button>

<button class="quick-btn">
<i class="fa-solid fa-calendar"></i>
Schedule Meeting
</button>

<button class="quick-btn">
<i class="fa-solid fa-file-lines"></i>
Generate Report
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
