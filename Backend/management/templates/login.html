{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Welcome</h1>
      <p class="subtitle">Welcome back! Log in to access your account.</p>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        {% if error %}
          <p style="color: var(--color-danger-text); font-size: 0.9rem; margin-bottom: 10px;">{{ error }}</p>
        {% endif %}

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="switch">Don't have an account?<a href="{% url 'signup' %}">Create an account here</a></p>
    </div>
  </div>
</body>
</html>
