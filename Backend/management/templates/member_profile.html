{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ member.username }}'s Profile</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card dark-card">
        <div style="text-align: center; margin-bottom: 1rem">
          <div
            style="
              width: 70px;
              height: 70px;
              border-radius: 50%;
              background: var(--color-teal);
              color: var(--color-navy);
              font-size: 1.6rem;
              display: flex;
              align-items: center;
              justify-content: center;
              margin: auto;
            "
          >
            {{ member.username|first|upper }}
          </div>
          <h2 style="margin-top:12px;">{{ member.username }}</h2>
          <p class="subtitle">Qualifications &amp; Skills</p>
          <p style="color:var(--color-navy); font-size:0.95rem; line-height:1.5;">
            {{ profile.skills|default:"No skills listed yet." }}
          </p>
        </div>

        {% if is_leader_viewing %}
        <a href="{% url 'member_tasks' member.id %}" class="btn-primary" style="display:inline-block; text-decoration:none; margin-top:10px;">
          View {{ member.username }}'s Tasks
        </a>
        {% endif %}

        <p class="switch" style="margin-top: 1.5rem">
          <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
        </p>
      </div>
    </div>
  </body>
</html>
