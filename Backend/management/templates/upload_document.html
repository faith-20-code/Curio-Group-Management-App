{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Document</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Upload Document</h1>
      <p class="subtitle">
        {% if is_leader %}Upload a text brief or a file for AI task assignment.
        {% else %}Upload a PDF or Word file (used to match your skills to tasks).{% endif %}
      </p>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Upload</button>
      </form>

      <p class="switch"><a href="{% url 'dashboard' %}">← Back to Dashboard</a></p>
    </div>
  </div>
</body>
</html>
