{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>{{ title }}</h1>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p style="color:var(--color-danger-text);">{{ field.errors }}</p>{% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn-primary">Save</button>
      </form>
      <p class="switch"><a href="{% url 'dashboard' %}">← Back</a></p>
    </div>
  </div>
</body>
</html>
